<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cultural Fest Community Portal</title>


<link rel="stylesheet" href="css/style.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


</head>

<body>

<header>
    <h1>Cultural Fest Community Portal</h1>
    <p>
        Explore cultural programs, workshops, music performances,
        dance events and community celebrations happening around the city.
    </p>
</header>

<section class="filter-section">

    <h2>Find Events</h2>

    <label for="eventCategory">Category:</label>

    <select id="eventCategory">

        <option value="All">All Events</option>

        <option value="Music">Music</option>

        <option value="Workshop">Workshop</option>

        <option value="Dance">Dance</option>

        <option value="Art">Art</option>

    </select>

    <input
        type="text"
        id="searchInput"
        placeholder="Search events by name">

</section>

<section>

    <h2>Upcoming Cultural Events</h2>

    <div id="eventsContainer">

        <!-- Event cards will be generated here dynamically -->

    </div>

</section>

<hr>

<section class="registration-section">

    <h2>Event Registration</h2>

    <form id="registrationForm">

        <div>

            <label for="userName">
                Participant Name
            </label>

            <input
                type="text"
                id="userName"
                name="userName"
                placeholder="Enter your name">

        </div>

        <div>

            <label for="userEmail">
                Email Address
            </label>

            <input
                type="email"
                id="userEmail"
                name="userEmail"
                placeholder="Enter your email">

        </div>

        <div>

            <label for="selectedEvent">
                Select Event
            </label>

            <select
                id="selectedEvent"
                name="selectedEvent">

                <option value="">
                    Choose an Event
                </option>

                <option value="Chennai Cultural Music Fest">
                    Chennai Cultural Music Fest
                </option>

                <option value="Traditional Cooking Workshop">
                    Traditional Cooking Workshop
                </option>

                <option value="Community Folk Dance Evening">
                    Community Folk Dance Evening
                </option>

                <option value="Local Art Exhibition">
                    Local Art Exhibition
                </option>

            </select>

        </div>

        <button
            type="submit"
            id="registerBtn">

            Register Now

        </button>

    </form>

    <p id="message"></p>

</section>

<footer>

    <p>
        © 2026 Cultural Fest Community Portal
    </p>

</footer>

<script src="js/events.js"></script>
<script src="js/api.js"></script>
<script src="js/main.js"></script>
<script src="js/jquery-script.js"></script>


</body>

</html>
